# Rebuilds WALSER_RECON.js whenever any individual script changes on main.
name: Build combined script
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'build.py'
      - '!WALSER_RECON.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build.py
      - run: node --check WALSER_RECON.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add WALSER_RECON.js
          git diff --cached --quiet || git commit -m "Rebuild WALSER_RECON.js"
          git push
